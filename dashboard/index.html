<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART SCAN: Live Signal Interceptor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scan-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
    .hit-pulse { animation: hitFlash 0.3s ease-out; }
    @keyframes hitFlash {
      0% { transform: scaleY(1.15); filter: brightness(1.8); }
      100% { transform: scaleY(1); filter: brightness(1); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 flex flex-col items-center justify-center">

  <div class="w-full max-w-5xl flex flex-col gap-4">

    <!-- Top Bar: Clean, Minimal, No Blabber -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center gap-3">
        <span class="w-3.5 h-3.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <h1 class="text-xl font-extrabold tracking-tight text-white">SMART SCAN</h1>
        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-mono font-semibold" id="modeBadge">Fixed Signals</span>
      </div>

      <!-- Live Score & Capture Rate -->
      <div class="flex items-center gap-6">
        <div class="text-right">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Captured</div>
          <div class="text-2xl font-black text-emerald-400 font-mono" id="kpiScore">+0.0</div>
        </div>
        <div class="h-8 w-px bg-slate-800"></div>
        <div class="text-right">
          <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold">Accuracy</div>
          <div class="text-2xl font-black text-cyan-400 font-mono" id="kpiRate">0%</div>
        </div>
      </div>

      <!-- Minimal Controls -->
      <div class="flex items-center gap-2">
        <button id="btnPlay" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm px-5 py-2 rounded-xl transition shadow-lg flex items-center gap-2 cursor-pointer">
          <span id="playIcon">▶</span> <span id="playText">Scan</span>
        </button>
        <button id="btnReset" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-4 py-2 rounded-xl transition cursor-pointer">
          Reset
        </button>
        <select id="scenarioSelect" class="bg-slate-800 border border-slate-700 text-xs font-semibold rounded-xl px-3 py-2 text-slate-200 focus:outline-none">
          <option value="stationary">Stationary Signals</option>
          <option value="hopping">Hopping Signals</option>
          <option value="harsh">Noisy Channel</option>
        </select>
      </div>
    </header>

    <!-- Spectrum Display: 20 Channels Live Power -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-3">
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-slate-300 uppercase tracking-wider">Radio Spectrum (20 Channels)</span>
        <div class="flex items-center gap-4 text-[11px]">
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span> Signal Active</span>
          <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-amber-400"></span> AI Scanner</span>
        </div>
      </div>

      <!-- 20 Spectrum Columns -->
      <div id="spectrum" class="grid grid-cols-20 gap-1.5 h-44 bg-slate-950 p-3 rounded-xl border border-slate-800/80 items-end">
        <!-- Bars injected by JS -->
      </div>

      <!-- AI Action Banner -->
      <div class="bg-slate-950 border border-slate-800/80 rounded-xl px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-slate-600"></div>
          <span id="statusText" class="text-sm font-semibold text-slate-300">Ready. Click Scan to start capturing signals.</span>
        </div>
        <div id="statusResult" class="text-xs font-bold font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-400">IDLE</div>
      </div>
    </section>

    <!-- Waterfall Spectrogram -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col gap-2">
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-slate-300 uppercase tracking-wider">Signal Waterfall (History Flowing Down &darr;)</span>
        <span class="text-[11px] text-slate-400 font-mono" id="stepCounter">Step 0 / 200</span>
      </div>
      <div class="relative w-full h-64 bg-slate-950 rounded-xl border border-slate-800 overflow-hidden">
        <canvas id="waterfall" class="w-full h-full block"></canvas>
      </div>
    </section>

  </div>

  <script>
    const BANDS = 20;
    const ROWS = 45;
    let step = 0;
    let isRunning = false;
    let timer = null;
    let score = 0.0;
    let hits = 0;
    let scans = 0;

    // Emitters state
    let emitters = [];
    let noiseLevel = 0.08;

    // AI Tracking memory
    let belief = new Array(BANDS).fill(0.05);

    // Waterfall buffer
    let history = [];
    for (let r = 0; r < ROWS; r++) history.push(new Array(BANDS).fill(0.05));

    // UI elements
    const spectrumDiv = document.getElementById('spectrum');
    const canvas = document.getElementById('waterfall');
    const ctx = canvas.getContext('2d');
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const scenarioSelect = document.getElementById('scenarioSelect');

    // Build 20 columns
    spectrumDiv.innerHTML = '';
    for (let i = 0; i < BANDS; i++) {
      const col = document.createElement('div');
      col.id = `col_${i}`;
      col.className = 'h-full flex flex-col justify-end items-center relative';
      col.innerHTML = `
        <div id="bar_${i}" class="w-full bg-slate-800 rounded-t transition-all duration-75" style="height: 10%;"></div>
        <span class="text-[10px] text-slate-500 mt-1 font-mono font-semibold">${i}</span>
      `;
      spectrumDiv.appendChild(col);
    }

    function initScenario() {
      const mode = scenarioSelect.value;
      emitters = [];
      noiseLevel = mode === 'harsh' ? 0.28 : 0.06;

      if (mode === 'stationary') {
        document.getElementById('modeBadge').innerText = 'Stationary Signals';
        emitters = [
          { id: 1, band: 4, power: 0.90, hops: [4], hopRate: 0 },
          { id: 2, band: 11, power: 0.85, hops: [11], hopRate: 0 },
          { id: 3, band: 16, power: 0.95, hops: [16], hopRate: 0 }
        ];
      } else if (mode === 'hopping') {
        document.getElementById('modeBadge').innerText = 'Hopping Signals';
        emitters = [
          { id: 1, band: 2, power: 0.90, hops: [2, 7, 13, 18, 5], hopRate: 0.22 },
          { id: 2, band: 9, power: 0.85, hops: [9, 14, 3, 11], hopRate: 0.25 }
        ];
      } else {
        document.getElementById('modeBadge').innerText = 'Noisy Channel';
        emitters = [
          { id: 1, band: 6, power: 0.65, hops: [6], hopRate: 0.05 },
          { id: 2, band: 14, power: 0.60, hops: [14, 10], hopRate: 0.10 }
        ];
      }

      step = 0;
      score = 0.0;
      hits = 0;
      scans = 0;
      belief = new Array(BANDS).fill(0.05);
      history = [];
      for (let r = 0; r < ROWS; r++) history.push(new Array(BANDS).fill(noiseLevel));

      updateStats(null, false, false);
      renderWaterfall(null);
    }

    // AI Decision: Adaptive MoE behavior
    function aiPickBand() {
      // Pick highest belief with slight curiosity
      if (Math.random() < 0.10) {
        return Math.floor(Math.random() * BANDS);
      }
      let best = 0, max = -1;
      for (let i = 0; i < BANDS; i++) {
        if (belief[i] > max) { max = belief[i]; best = i; }
      }
      return best;
    }

    function tick() {
      if (step >= 200) { pause(); return; }
      step++;

      // Emitters hop
      for (const em of emitters) {
        if (em.hopRate > 0 && Math.random() < em.hopRate) {
          const nextIdx = (em.hops.indexOf(em.band) + 1) % em.hops.length;
          em.band = em.hops[nextIdx];
        }
      }

      // AI Scans
      const scanBand = aiPickBand();

      // Check if signal exists on scanBand
      let isHit = false;
      let activeEm = null;
      for (const em of emitters) {
        if (em.band === scanBand) {
          isHit = true;
          activeEm = em;
          break;
        }
      }

      scans++;
      if (isHit) {
        hits++;
        score += 1.0;
        belief[scanBand] = Math.min(1.0, belief[scanBand] * 0.4 + 0.85);
      } else {
        score -= 0.2;
        belief[scanBand] = Math.max(0.02, belief[scanBand] * 0.6);
      }

      // Waterfall update
      const row = new Array(BANDS).fill(noiseLevel);
      for (const em of emitters) {
        row[em.band] = em.power;
      }
      history.pop();
      history.unshift(row);

      // Render
      updateStats(scanBand, isHit, activeEm);
      renderSpectrum(scanBand, row, isHit);
      renderWaterfall(scanBand);
    }

    function updateStats(scanBand, isHit, activeEm) {
      document.getElementById('kpiScore').innerText = `${score >= 0 ? '+' : ''}${score.toFixed(1)}`;
      const rate = scans > 0 ? Math.round((hits / scans) * 100) : 0;
      document.getElementById('kpiRate').innerText = `${rate}%`;
      document.getElementById('stepCounter').innerText = `Step ${step} / 200`;

      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const res = document.getElementById('statusResult');

      if (scanBand === null) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-600';
        text.innerText = 'Ready. Click Scan to start capturing signals.';
        res.className = 'text-xs font-bold font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-400';
        res.innerText = 'IDLE';
        return;
      }

      if (isHit) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping';
        text.innerHTML = `<span class="text-white font-bold">LOCKED ON!</span> Captured signal on <span class="text-amber-400 font-bold">Channel ${scanBand}</span> (+1.0 point)`;
        res.className = 'text-xs font-bold font-mono px-2.5 py-1 rounded bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30';
        res.innerText = 'HIT +1.0';
      } else {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
        text.innerHTML = `Scanned <span class="text-slate-200 font-semibold">Channel ${scanBand}</span> &mdash; Channel was silent (-0.2)`;
        res.className = 'text-xs font-bold font-mono px-2.5 py-1 rounded bg-slate-800 text-slate-400';
        res.innerText = 'MISS -0.2';
      }
    }

    function renderSpectrum(scanBand, powerRow, isHit) {
      for (let i = 0; i < BANDS; i++) {
        const bar = document.getElementById(`bar_${i}`);
        const col = document.getElementById(`col_${i}`);
        const p = powerRow[i];
        bar.style.height = `${Math.max(12, Math.min(95, p * 100))}%`;

        if (p > 0.4) {
          bar.className = 'w-full bg-emerald-400 rounded-t shadow-md shadow-emerald-500/40';
        } else {
          bar.className = 'w-full bg-slate-800 rounded-t';
        }

        if (i === scanBand) {
          col.classList.add('scan-glow', 'border-b-4', isHit ? 'border-emerald-400' : 'border-amber-400');
          if (isHit) bar.classList.add('hit-pulse');
        } else {
          col.classList.remove('scan-glow', 'border-b-4', 'border-emerald-400', 'border-amber-400');
          bar.classList.remove('hit-pulse');
        }
      }
    }

    function renderWaterfall(scanBand) {
      const w = canvas.width = canvas.parentElement.clientWidth;
      const h = canvas.height = canvas.parentElement.clientHeight;
      const colW = w / BANDS;
      const rowH = h / ROWS;

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, w, h);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < BANDS; c++) {
          const val = history[r][c];
          if (val > 0.4) {
            ctx.fillStyle = '#34d399'; // bright emerald
          } else {
            const n = Math.floor(val * 40);
            ctx.fillStyle = `rgb(${10 + n}, ${15 + n}, ${30 + n})`;
          }
          ctx.fillRect(c * colW, r * rowH, colW - 1, rowH);
        }
      }

      // Scanner highlight box on top row
      if (scanBand !== null) {
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(scanBand * colW, 0, colW - 1, rowH * 2.5);
      }
    }

    function play() {
      isRunning = true;
      playIcon.innerText = '⏸';
      playText.innerText = 'Pause';
      btnPlay.classList.replace('bg-emerald-500', 'bg-amber-500');
      btnPlay.classList.replace('hover:bg-emerald-400', 'hover:bg-amber-400');
      timer = setInterval(tick, 180);
    }

    function pause() {
      isRunning = false;
      clearInterval(timer);
      playIcon.innerText = '▶';
      playText.innerText = 'Scan';
      btnPlay.classList.replace('bg-amber-500', 'bg-emerald-500');
      btnPlay.classList.replace('hover:bg-amber-400', 'hover:bg-emerald-400');
    }

    btnPlay.addEventListener('click', () => isRunning ? pause() : play());
    btnReset.addEventListener('click', () => { pause(); initScenario(); });
    scenarioSelect.addEventListener('change', () => { pause(); initScenario(); });
    window.addEventListener('resize', () => renderWaterfall(null));

    // Start clean
    initScenario();
  </script>
</body>
</html>
